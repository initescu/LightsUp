name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild \
            -project LightsUp.xcodeproj \
            -scheme LightsUp \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sign (ad-hoc)
        run: |
          APP=build/DerivedData/Build/Products/Release/LightsUp.app
          # Sign embedded frameworks/dylibs first (--deep is deprecated and
          # breaks the code-signature chain, causing TCC to silently reject
          # entitlements).
          if [ -d "$APP/Contents/Frameworks" ]; then
            find "$APP/Contents/Frameworks" \
              \( -name "*.framework" -o -name "*.dylib" \) | \
              while read -r fw; do
                codesign --force --sign - "$fw"
              done
          fi
          # Then sign the main bundle with entitlements
          codesign --force --sign - \
            --entitlements LightsUp/LightsUp.entitlements \
            --options runtime \
            "$APP"

      - name: Package DMG
        run: |
          STAGE=$(mktemp -d)
          cp -r build/DerivedData/Build/Products/Release/LightsUp.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "LightsUp ${{ env.VERSION }}" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "build/LightsUp-${{ env.VERSION }}.dmg"
          rm -rf "$STAGE"

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            "build/LightsUp-${{ env.VERSION }}.dmg" \
            --title "LightsUp ${{ env.VERSION }}" \
            --notes "## Install LightsUp ${{ env.VERSION }}

          **Requirements:** macOS 26 (Tahoe) or later

          ### Steps
          1. Download **LightsUp-${{ env.VERSION }}.dmg** below
          2. Open the DMG and drag **LightsUp** into Applications
          3. First launch: double-click will show a Gatekeeper warning — click **Done**
          4. Go to **System Settings → Privacy & Security** → click **Open Anyway** for LightsUp
          5. Grant calendar access when prompted

          > This build is ad-hoc signed (no Apple Developer ID). Gatekeeper will warn on first
          > launch — the System Settings bypass is required once."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
